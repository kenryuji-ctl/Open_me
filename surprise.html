<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>A Little Surprise ❤️</title>
<style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#ff9fb2,#ffdbe7,#fff5f8);font-family:Segoe UI,sans-serif;overflow:hidden}
.card{width:90%;max-width:700px;background:rgba(255,255,255,.2);backdrop-filter:blur(12px);border-radius:24px;padding:30px;text-align:center;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.15)}
h1{font-size:38px;margin-bottom:15px}
p{font-size:18px;line-height:1.7}
img{width:160px;border-radius:18px}
button{margin-top:25px;padding:14px 30px;border:none;border-radius:40px;background:#ff4f7d;color:#fff;font-size:18px;cursor:pointer}
.heart{position:fixed;bottom:-20px;animation:up 8s linear infinite}
@keyframes up{to{transform:translateY(-110vh);opacity:0}}
</style>
</head>
<body>
<div class="card">
<img src="https://tenor.com/view/piske-and-usagi-gif-16375894191246123323" alt="Cute Bear">
<h1>💖 One More Thing... 💖</h1>
<p>
Happy Birthday, my bebe! I hope this little surprise makes you smile.
You are the best gift in my life, and I wish you endless happiness,
good health, and beautiful memories today and always. ❤️
</p>
<button onclick="alert('I Love You Forever! ❤️')">💝 Tap Me 💝</button>
</div>
<script>
setInterval(()=>{const h=document.createElement('div');h.className='heart';h.textContent='💖';h.style.left=Math.random()*100+'vw';h.style.fontSize=(15+Math.random()*20)+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),8000)},300);
</script>
</body>
</html>
